name: Build Sideloadly-Ready iOS IPA (ByteForge)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/web/**'
      - 'package.json'

jobs:
  build-ipa:
    name: Build & Package Native iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm --prefix apps/web run build:cap
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://site--byteforge-backend--qb4y2b9qnwsy.code.run' }}
          CAPACITOR_BUILD: 'true'

      - name: Sync Capacitor iOS
        run: npx --prefix apps/web cap sync ios

      - name: Install CocoaPods
        run: |
          cd apps/web/ios/App
          pod install

      - name: Compile and Archive iOS App Scheme
        run: |
          cd apps/web/ios/App
          
          # Clean build artifacts
          xcodebuild clean \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release
          
          # Archive build for generic iOS device with code signing disabled for Sideloadly
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload and Create ByteForge.ipa
        run: |
          cd apps/web/ios/App
          mkdir -p build/ipa/Payload
          
          # Copy the compiled App.app bundle containing the real Mach-O binary
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          
          cd build/ipa
          # Preserve symlinks with -y flag (critical for dynamic frameworks)
          zip -r -y ByteForge.ipa Payload

      - name: Verify IPA Structure & Binary Integrity
        run: |
          cd apps/web/ios/App/build/ipa
          
          echo "======================================================="
          echo "🔍 1. Inspecting Payload Architecture:"
          echo "======================================================="
          unzip -l ByteForge.ipa | grep "Payload/App.app/" | head -n 30
          
          echo "======================================================="
          echo "🔍 2. Verifying Processed Info.plist Keys:"
          echo "======================================================="
          unzip -p ByteForge.ipa Payload/App.app/Info.plist > /tmp/target_info.plist
          plutil -p /tmp/target_info.plist | grep -E "CFBundleExecutable|CFBundleIdentifier|CFBundleDisplayName|CFBundleName"
          
          EXEC_NAME=$(plutil -extract CFBundleExecutable raw /tmp/target_info.plist)
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw /tmp/target_info.plist)
          
          echo "Parsed CFBundleExecutable: '$EXEC_NAME'"
          echo "Parsed CFBundleIdentifier: '$BUNDLE_ID'"
          
          # Verify no literal unexpanded variables exist
          if [[ "$EXEC_NAME" == *"\$"* ]] || [[ "$BUNDLE_ID" == *"\$"* ]]; then
            echo "❌ ERROR: Unresolved build variable in Info.plist!"
            exit 1
          fi
          
          echo "======================================================="
          echo "🔍 3. Verifying Real Mach-O Binary:"
          echo "======================================================="
          mkdir -p /tmp/verify_app
          unzip -q ByteForge.ipa -d /tmp/verify_app
          
          BINARY_PATH="/tmp/verify_app/Payload/App.app/$EXEC_NAME"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ ERROR: Executable binary not found at $BINARY_PATH!"
            exit 1
          fi
          
          # Must output: Mach-O 64-bit executable arm64
          file "$BINARY_PATH"
          
          echo "======================================================="
          echo "✅ VERIFICATION PASSED: Sideloadly-Ready IPA Validated!"
          echo "======================================================="

      - name: Upload Verified IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-iOS-Sideloadly-IPA
          path: apps/web/ios/App/build/ipa/ByteForge.ipa
          if-no-files-found: error
          retention-days: 14
